<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iglesia.los.almedros. MMM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-principal: #1f6f5c;
    --color-principal-oscuro: #154d40;
    --color-acento: #f2a541;
    --fondo: #946941;
    --fondo-alt: rgba(60,34,12,.2);
    --texto: #1d2420;
    --texto-suave: #5b655f;
    --borde: #7a5636;
    --radio: 14px;
    --max: 1100px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--texto);
    background:
      radial-gradient(circle at 14% 18%, rgba(255,250,200,.55), transparent 30%),
      radial-gradient(circle at 86% 10%, rgba(255,247,185,.42), transparent 26%),
      radial-gradient(circle at 68% 58%, rgba(255,250,205,.30), transparent 34%),
      radial-gradient(circle at 18% 86%, rgba(255,248,190,.38), transparent 28%),
      radial-gradient(circle at 92% 90%, rgba(255,250,200,.28), transparent 24%),
      var(--fondo);
    background-attachment: fixed;
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  .contenedor { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

  /* Navegación */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(148,105,65,.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--borde);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-weight: 800; font-size: 1.3rem; color: var(--color-principal); letter-spacing: -.5px; }
  .logo span { color: var(--color-acento); }
  nav ul { display: flex; gap: 26px; list-style: none; align-items: center; }
  nav a { font-size: .95rem; color: var(--texto-suave); }
  nav a:hover { color: var(--color-principal); }
  .boton {
    display: inline-block; padding: 12px 24px; border-radius: 999px;
    background: var(--color-principal); color: #fff !important; font-weight: 600;
    border: 2px solid var(--color-principal); cursor: pointer; font-size: 1rem;
    transition: transform .15s, background .15s;
  }
  .boton:hover { background: var(--color-principal-oscuro); transform: translateY(-2px); }
  .boton.secundario { background: transparent; color: var(--color-principal) !important; }
  .boton.secundario:hover { background: var(--color-principal); color: #fff !important; }

  /* Hero */
  .hero { padding: 28px 0 80px; }
  .hero-grid { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .etiqueta {
    display: inline-block; background: var(--fondo-alt); color: var(--color-principal);
    padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600; margin-bottom: 18px;
  }
  h1 { font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(2.8rem, 8vw, 5.5rem); line-height: 1.1; letter-spacing: 0; margin-bottom: 0; text-align: center; color: #ffe9a8; text-shadow: 0 2px 6px rgba(60,35,10,.45); }
  h1 em { font-style: normal; color: var(--color-principal); }
  .hero p { font-size: 1.15rem; color: var(--texto-suave); max-width: 520px; margin-bottom: 30px; }
  .hero-botones { display: flex; gap: 14px; flex-wrap: wrap; }
  .hero-visual {
    aspect-ratio: 1 / 1; width: 100%; max-width: 420px; justify-self: center; border-radius: 28px;
    background: #fff8e7;
    position: relative; overflow: hidden;
    display: flex; justify-content: center; color: #fff; text-align: center; padding: 28px 22px;
  }
  .hero-visual::before, .hero-visual::after {
    content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12);
  }
  .hero-visual::before { width: 130px; height: 130px; top: -40px; right: -30px; }
  .hero-visual::after { width: 90px; height: 90px; bottom: -25px; left: -20px; background: rgba(242,165,65,.35); }
  .hero-visual p { position: relative; margin: 0; color: #5a3a1a; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(1.8rem, 3.8vw, 2.8rem); line-height: 1.15; max-width: none; text-align: center; }
  .hero-visual .versiculo { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .hero-visual blockquote { margin: auto 0; max-width: none; color: #5a3a1a; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 600; font-size: clamp(1.1rem, 2.2vw, 1.6rem); line-height: 1.4; text-align: center; }
  .hero-visual p small { display: block; margin-top: 16px; font-size: .42em; font-weight: 600; letter-spacing: .08em; color: #8a6340; }

  /* Secciones */
  section { padding: 80px 0; }
  section.alt { background: var(--fondo-alt); }
  .titulo-seccion { text-align: center; max-width: 620px; margin: 0 auto 50px; }
  .titulo-seccion h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); letter-spacing: -.6px; margin-bottom: 10px; }
  .titulo-seccion p { color: var(--texto-suave); }

  .tarjetas { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); justify-content: center; gap: 28px; }
  .tarjeta {
    background: #fff; border: 1px solid var(--borde); border-radius: var(--radio);
    padding: 30px 26px; aspect-ratio: 3 / 4; transition: transform .2s, box-shadow .2s;
  }
  .tarjeta:hover { transform: translateY(-5px); box-shadow: 0 14px 30px rgba(0,0,0,.07); }
  .icono {
    width: 52px; height: 52px; border-radius: 14px; background: var(--fondo-alt);
    display: grid; place-items: center; font-size: 1.6rem; margin-bottom: 18px;
  }
  .tarjeta h3 { margin-bottom: 8px; font-size: 1.15rem; }
  .tarjeta p { color: var(--texto-suave); font-size: .97rem; }

  /* Sobre nosotros */
  .sobre { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
  .sobre h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); letter-spacing: -.6px; margin-bottom: 16px; }
  .sobre p { color: var(--texto-suave); margin-bottom: 14px; }
  .cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .cifra {
    background: #fff; border: 1px solid var(--borde); border-radius: var(--radio);
    padding: 26px 20px; text-align: center;
  }
  .cifra strong { display: block; font-size: 2rem; color: var(--color-principal); }
  .cifra span { font-size: .9rem; color: var(--texto-suave); }

  /* Proceso */
  .pasos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; counter-reset: paso; }
  .paso { text-align: center; padding: 10px; }
  .paso::before {
    counter-increment: paso; content: counter(paso);
    display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 14px;
    border-radius: 50%; background: var(--color-acento); color: #3a2800; font-weight: 800; font-size: 1.2rem;
  }
  .paso h3 { margin-bottom: 6px; }
  .paso p { color: var(--texto-suave); font-size: .95rem; }

  /* CTA y contacto */
  .cta {
    background: #fff8e7; color: var(--texto); text-align: center;
    border-radius: 28px; padding: 60px 24px;
  }
  .cta h2 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); margin-bottom: 10px; }
  .cta p { opacity: .9; margin-bottom: 26px; }
  .cta .boton { background: var(--color-acento); border-color: var(--color-acento); color: #3a2800 !important; }
  .cta .boton:hover { background: #ffb85a; }

  .contacto { display: grid; grid-template-columns: 1fr 1.2fr; gap: 50px; }
  .contacto h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); letter-spacing: -.6px; margin-bottom: 14px; }
  .contacto > div:first-child p { color: var(--texto-suave); margin-bottom: 22px; }
  .datos li { list-style: none; margin-bottom: 12px; display: flex; gap: 10px; }
  form { background: #fff; border: 1px solid var(--borde); border-radius: var(--radio); padding: 30px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input, textarea {
    width: 100%; padding: 12px 14px; border: 1px solid var(--borde); border-radius: 10px;
    font: inherit; margin-bottom: 18px; background: var(--fondo);
  }
  input:focus, textarea:focus { outline: 2px solid var(--color-principal); border-color: transparent; }
  textarea { min-height: 120px; resize: vertical; }
  form .boton { width: 100%; }
  #mensaje-ok { display: none; margin-top: 14px; color: var(--color-principal); font-weight: 600; text-align: center; }

  footer { background: #14211c; color: #b9c4be; padding: 36px 0; text-align: center; font-size: .9rem; }
  footer .logo { color: #fff; display: block; margin-bottom: 8px; }

  .whatsapp {
    position: fixed; right: 20px; bottom: 20px; width: 58px; height: 58px; border-radius: 50%;
    background: #25d366; color: #fff; display: grid; place-items: center; font-size: 1.7rem;
    box-shadow: 0 8px 20px rgba(0,0,0,.25); z-index: 20;
  }

  @media (max-width: 800px) {
    nav ul li:not(:last-child) { display: none; }
    .sobre, .contacto { grid-template-columns: 1fr; }
    .hero { padding: 20px 0 50px; }
    .hero-visual { aspect-ratio: auto; }
    section { padding: 56px 0; }
  }
</style>
</head>
<body>

<header><div class="contenedor nav"><a href="#inicio" class="logo"><span></span></a><nav><ul><li><a href="#servicios"></a></li><li><a href="#nosotros"></a></li><li><a href="#proceso"></a></li><li></li></ul></nav></div></header><main><!-- HERO --><section class="hero" id="inicio"><div class="contenedor hero-grid"><h1>Iglesia los almendros</h1><div class="hero-visual"><div class="versiculo"><p>Colosenses 3:23</p><blockquote>Y todo lo que hagáis, hacedlo de corazón, como para el Señor y no para los hombres.</blockquote></div></div></div></section><!-- SERVICIOS --><section class="alt" id="servicios"><div class="contenedor"><div class="titulo-seccion"><h2></h2><p></p></div><div class="tarjetas"><article class="tarjeta"></article><article class="tarjeta"></article></div></div></section><!-- NOSOTROS --><section id="nosotros"><div class="contenedor sobre"><div><h2></h2><p></p><p></p></div></div></section><!-- PROCESO --><section class="alt" id="proceso"><div class="contenedor"><div class="titulo-seccion"><h2></h2><p></p></div><div class="pasos"><div class="paso"><h3></h3><p></p></div><div class="paso"><h3></h3><p></p></div><div class="paso"><h3></h3><p></p></div><div class="paso"><h3></h3><p></p></div></div></div></section><!-- CTA --><section><div class="contenedor"><div class="cta"><h2></h2><p></p><a href="#contacto" class="boton"></a></div></div></section><!-- CONTACTO --><section class="alt" id="contacto"><div class="contenedor contacto"><div><h2></h2><p></p><ul class="datos"><li>📍</li><li>📞</li><li>✉️</li><li>🕘</li></ul></div><form id="formulario"><label for="nombre"></label><input id="nombre" name="nombre" type="text" required><label for="correo"></label><input id="correo" name="correo" type="email" required><label for="texto"></label><textarea id="texto" name="texto" required></textarea><p id="mensaje-ok"></p></form></div></section></main><footer><div class="contenedor"><span class="logo"><span style="color:var(--color-acento)"></span></span><p><span id="anio"></span></p></div></footer><a class="whatsapp" href="https://wa.me/56900000000" target="_blank" rel="noopener">💬</a>

<script>
  document.getElementById('formulario').addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = document.getElementById('nombre').value;
    var correo = document.getElementById('correo').value;
    var texto = document.getElementById('texto').value;
    var asunto = encodeURIComponent(nombre);
    var cuerpo = encodeURIComponent(texto + '\n\n' + nombre + '\n' + correo);
    window.location.href = 'mailto:contacto@minegocio.cl?subject=' + asunto + '&body=' + cuerpo;
  });
</script>
</body>
</html>
